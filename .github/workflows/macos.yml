name: macOS

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          DEVELOPER_DIR="$(xcode-select -p)" xcodebuild \
            -project Quotablet.xcodeproj \
            -scheme Quotablet \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/QuotabletDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
